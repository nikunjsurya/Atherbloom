<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atherbloom — Venture Past Our Sky</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          serif: ['"Cormorant Garamond"', 'serif'],
          sans: ['Manrope', 'system-ui', 'sans-serif']
        }
      }
    }
  }
</script>

<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Manrope', system-ui, sans-serif;
    background: #0b0b0d;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Hero background — kept perfectly still */
  .hero-bg {
    position: absolute;
    inset: 0;
    background-image: url('assets/hero.png?v=2');
    background-size: cover;
    background-position: center;
  }

  /* ─── Living-photograph wind layers ──────────────────────────────── */

  /* Petal container — full hero area, non-interactive */
  .petals {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 5;
  }
  .petal {
    position: absolute;
    top: var(--y, 30%);
    left: -8%;
    width: var(--s, 14px);
    height: calc(var(--s, 14px) * 0.78);
    opacity: 0;
    will-change: transform, opacity;
    filter: blur(var(--b, 0px));
    animation:
      petalDrift var(--dur, 22s) linear var(--delay, 0s) infinite,
      petalFlutter var(--fdur, 5.5s) ease-in-out var(--delay, 0s) infinite;
  }
  .petal svg { width: 100%; height: 100%; display: block; }
  @keyframes petalDrift {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg);            opacity: 0; }
    6%   { opacity: var(--o, 0.85); }
    50%  { transform: translate3d(55vw, var(--dy, 30px), 0) rotate(180deg); }
    94%  { opacity: var(--o, 0.85); }
    100% { transform: translate3d(120vw, calc(var(--dy, 30px) * 1.8), 0) rotate(360deg); opacity: 0; }
  }
  @keyframes petalFlutter {
    0%, 100% { margin-top: 0; }
    50%      { margin-top: var(--flutter, 12px); }
  }

  /* Top-corner blossom sway — semi-transparent rosy washes
     positioned over the cherry-branch areas, gently swinging
     from a top anchor like a branch in the breeze. */
  .blossom-sway {
    position: absolute;
    pointer-events: none;
    will-change: transform;
    transform-origin: 50% 0%;
    mix-blend-mode: soft-light;
    opacity: 0.55;
  }
  .blossom-sway.tl {
    top: -4%; left: -6%;
    width: 38vw; height: 32vh;
    background: radial-gradient(ellipse at 30% 35%, rgba(255,205,225,0.55) 0%, rgba(255,205,225,0.18) 35%, transparent 65%);
    animation: swayLeft 9s ease-in-out infinite alternate;
  }
  .blossom-sway.tr {
    top: -4%; right: -6%;
    width: 38vw; height: 32vh;
    background: radial-gradient(ellipse at 70% 35%, rgba(255,205,225,0.55) 0%, rgba(255,205,225,0.18) 35%, transparent 65%);
    animation: swayRight 10.5s ease-in-out infinite alternate;
  }
  @keyframes swayLeft {
    0%   { transform: rotate(-0.6deg) translateX(0); }
    100% { transform: rotate(1.2deg)  translateX(4px); }
  }
  @keyframes swayRight {
    0%   { transform: rotate(0.6deg)  translateX(0); }
    100% { transform: rotate(-1.2deg) translateX(-4px); }
  }

  /* Flower field sway — soft horizontal shimmer over the
     bottom petal area, suggesting wind across the meadow. */
  .field-sway {
    position: absolute;
    left: -4%; right: -4%;
    bottom: 0;
    height: 32vh;
    pointer-events: none;
    background:
      radial-gradient(ellipse 60% 60% at 20% 80%, rgba(255,220,235,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 70% 90%, rgba(255,230,240,0.16) 0%, transparent 60%),
      radial-gradient(ellipse 70% 50% at 50% 70%, rgba(255,255,255,0.10) 0%, transparent 65%);
    mix-blend-mode: soft-light;
    will-change: transform;
    animation: fieldSway 11s ease-in-out infinite alternate;
  }
  .field-sway.layer-2 {
    bottom: -2%;
    height: 22vh;
    background:
      radial-gradient(ellipse 40% 60% at 30% 90%, rgba(220,255,220,0.10) 0%, transparent 65%),
      radial-gradient(ellipse 50% 60% at 80% 95%, rgba(255,235,220,0.12) 0%, transparent 65%);
    animation: fieldSway 14s ease-in-out -3s infinite alternate-reverse;
    opacity: 0.85;
  }
  @keyframes fieldSway {
    0%   { transform: translate3d(-1.2%, 0, 0) scaleX(1.00); }
    50%  { transform: translate3d(0.6%, -2px, 0) scaleX(1.02); }
    100% { transform: translate3d(1.2%, 0, 0) scaleX(1.00); }
  }

  /* Mist / sunlight shimmer — wide, very faint, slowly crossing. */
  .mist {
    position: absolute;
    inset: -10% -20% -10% -20%;
    pointer-events: none;
    background:
      radial-gradient(ellipse 40% 50% at 20% 35%, rgba(255,240,210,0.10) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 75% 25%, rgba(255,255,255,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 60% 60% at 50% 60%, rgba(255,255,255,0.05) 0%, transparent 70%);
    mix-blend-mode: screen;
    filter: blur(20px);
    will-change: transform, opacity;
    animation: mistMove 28s ease-in-out infinite alternate;
  }
  @keyframes mistMove {
    0%   { transform: translate3d(-3%, 0, 0);  opacity: 0.55; }
    50%  { transform: translate3d(2%, -1%, 0); opacity: 0.85; }
    100% { transform: translate3d(4%, 0, 0);   opacity: 0.65; }
  }

  /* Sun shimmer — small warm glow that pulses very gently. */
  .sun-shimmer {
    position: absolute;
    top: -6%; left: -4%;
    width: 32vw; height: 32vw;
    pointer-events: none;
    background: radial-gradient(circle at 30% 30%, rgba(255,235,200,0.35) 0%, rgba(255,225,180,0.10) 30%, transparent 60%);
    mix-blend-mode: screen;
    filter: blur(10px);
    animation: sunBreathe 9s ease-in-out infinite alternate;
  }
  @keyframes sunBreathe {
    0%   { opacity: 0.55; transform: translate3d(0, 0, 0); }
    100% { opacity: 0.85; transform: translate3d(0.6%, 0.4%, 0); }
  }

  /* Readability gradients — top & bottom, very soft */
  .hero-vignette-top {
    background: linear-gradient(
      to bottom,
      rgba(8,12,28,0.55) 0%,
      rgba(8,12,28,0.22) 28%,
      rgba(8,12,28,0.00) 55%
    );
  }
  .hero-vignette-bottom {
    background: linear-gradient(
      to top,
      rgba(8,12,28,0.55) 0%,
      rgba(8,12,28,0.10) 30%,
      rgba(8,12,28,0.00) 55%
    );
  }

  /* Glass surfaces */
  .glass {
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.22);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.35) inset,
      0 20px 60px -20px rgba(20, 24, 60, 0.35);
  }
  .glass-soft {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(14px) saturate(130%);
    -webkit-backdrop-filter: blur(14px) saturate(130%);
    border: 1px solid rgba(255,255,255,0.16);
  }

  /* Buttons */
  .btn {
    transition: transform .35s cubic-bezier(.2,.7,.2,1), background .35s ease, box-shadow .35s ease, border-color .35s ease;
    will-change: transform;
  }
  .btn:hover { transform: translateY(-2px) scale(1.02); }
  .btn-primary {
    background: rgba(255,255,255,0.92);
    color: #1a1a22;
    border: 1px solid rgba(255,255,255,0.7);
    box-shadow: 0 10px 30px -10px rgba(255,255,255,0.45), 0 1px 0 rgba(255,255,255,0.9) inset;
  }
  .btn-primary:hover {
    background: rgba(255,255,255,1);
    box-shadow: 0 16px 40px -10px rgba(255,255,255,0.55), 0 1px 0 rgba(255,255,255,1) inset;
  }
  .btn-glass {
    background: rgba(255,255,255,0.10);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.40);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .btn-glass:hover {
    background: rgba(255,255,255,0.18);
    border-color: rgba(255,255,255,0.7);
  }

  /* Nav pill link hover */
  .nav-link {
    position: relative;
    transition: color .3s ease;
  }
  .nav-link::after {
    content: "";
    position: absolute;
    left: 12px; right: 12px; bottom: 6px;
    height: 1px;
    background: currentColor;
    transform: scaleX(0);
    transform-origin: center;
    transition: transform .4s cubic-bezier(.2,.7,.2,1);
    opacity: .8;
  }
  .nav-link:hover::after { transform: scaleX(1); }

  /* Reveal animations */
  .reveal {
    opacity: 0;
    transform: translateY(18px);
    filter: blur(6px);
    animation: revealIn 1.2s cubic-bezier(.2,.7,.2,1) forwards;
  }
  @keyframes revealIn {
    to { opacity: 1; transform: translateY(0); filter: blur(0); }
  }
  .delay-1 { animation-delay: .15s; }
  .delay-2 { animation-delay: .35s; }
  .delay-3 { animation-delay: .55s; }
  .delay-4 { animation-delay: .75s; }
  .delay-5 { animation-delay: 1.0s; }
  .delay-6 { animation-delay: 1.3s; }

  /* Floating partner row */
  .float-slow { animation: floatSlow 9s ease-in-out infinite alternate; }
  @keyframes floatSlow {
    0%   { transform: translateY(0); }
    100% { transform: translateY(-6px); }
  }

  /* Faint star/dust particles — subtle, dreamy */
  .dust {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 12% 30%, rgba(255,255,255,.35) 0, transparent 1.2px),
      radial-gradient(circle at 82% 18%, rgba(255,255,255,.30) 0, transparent 1.4px),
      radial-gradient(circle at 65% 60%, rgba(255,255,255,.25) 0, transparent 1px),
      radial-gradient(circle at 30% 78%, rgba(255,255,255,.25) 0, transparent 1px),
      radial-gradient(circle at 92% 70%, rgba(255,255,255,.28) 0, transparent 1.2px);
    mix-blend-mode: screen;
    opacity: .55;
    animation: dustFloat 14s ease-in-out infinite alternate;
  }
  @keyframes dustFloat {
    0%   { transform: translate3d(0, 0, 0); opacity: .45; }
    100% { transform: translate3d(0, -8px, 0); opacity: .65; }
  }

  /* Scroll cue */
  .scroll-cue {
    width: 22px; height: 36px;
    border: 1px solid rgba(255,255,255,.7);
    border-radius: 999px;
    position: relative;
  }
  .scroll-cue::after {
    content: "";
    position: absolute;
    left: 50%; top: 8px;
    width: 2px; height: 6px; border-radius: 2px;
    background: rgba(255,255,255,.85);
    transform: translateX(-50%);
    animation: cueDot 1.8s ease-in-out infinite;
  }
  @keyframes cueDot {
    0%   { transform: translate(-50%, 0); opacity: 1; }
    70%  { transform: translate(-50%, 12px); opacity: 0; }
    100% { transform: translate(-50%, 0); opacity: 0; }
  }

  /* Mobile menu */
  .mobile-menu-enter { animation: menuIn .35s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes menuIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Headline gradient text shimmer (very subtle) */
  .headline-text {
    background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.92) 60%, rgba(255,255,255,0.78) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 2px 30px rgba(20, 30, 70, 0.25);
  }

  /* Subtle decorative hairline */
  .hairline {
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(255,255,255,.5), transparent);
  }
</style>

</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

</body>
